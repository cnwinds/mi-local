# go2rtc for mi-local. Everything listens on this machine only: go2rtc's web page has no password and its API
# can rewrite this file, so never expose these ports. Browsers watch the cameras through mi-local instead.
#
# Logging in to Xiaomi adds a `xiaomi:` section here, and mi-local fills `streams:` on every Mi Home sync.
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: "127.0.0.1:8554"
webrtc:
  listen: "127.0.0.1:8555"
