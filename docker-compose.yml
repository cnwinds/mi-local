services:
  mi-local:
    image: ghcr.io/cnwinds/mi-local:latest
    container_name: mi-local
    # host network is required: gateway events arrive as multicast on 224.0.0.50:9898
    network_mode: host
    restart: always
    environment:
      HUB_PORT: "8080"
      HUB_LAN_IP: "0.0.0.0"
      # POSIX TZ string: works without tzdata in the image
      TZ: "CST-8"
    volumes:
      - ./data:/data

  # Camera streams (optional). Copy deploy/go2rtc.yaml to ./go2rtc/go2rtc.yaml *before* the first start:
  # without it go2rtc listens on every interface with an unprotected admin page.
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    network_mode: host
    restart: always
    environment:
      TZ: "CST-8"
    volumes:
      - ./go2rtc:/config
